# Generate the Xcode project with `xcodegen` (brew install xcodegen), then open
# Rippon.xcodeproj. The .xcodeproj is not checked in — this file is the source.
name: Rippon
options:
  bundleIdPrefix: dev.rippon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.11.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.65.0
  # Citadel's own fork of swift-nio-ssh; it pins the 0.3.x line.
  swift-nio-ssh:
    url: https://github.com/Joannis/swift-nio-ssh.git
    minorVersion: 0.3.4
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.12.3
  BigInt:
    url: https://github.com/attaswift/BigInt.git
    from: 5.2.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set this to your own team (Xcode → Signing & Capabilities) to run on a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Rippon:
    type: application
    platform: iOS
    sources:
      - path: Rippon
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-nio
        products: [NIOCore, NIOPosix, NIOFoundationCompat]
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-crypto
        product: Crypto
      - package: BigInt
    info:
      path: Rippon/Info.plist
      properties:
        CFBundleDisplayName: Rippon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Rippon connects over SSH to machines on your network.
        NSAppTransportSecurity:
          # Port forwards are served on http://localhost, and agents print plain
          # http:// links to dev servers; the in-app browser has to load both.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rippon.Rippon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

schemes:
  Rippon:
    build:
      targets:
        Rippon: all
    run:
      config: Debug
    archive:
      config: Release
