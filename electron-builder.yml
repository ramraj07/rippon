appId: com.rippon.app
productName: Rippon
copyright: Ramraj Velmurugan

directories:
  output: release
  buildResources: build

# The renderer and both node bundles are built by electron-vite into out/.
files:
  - out/**
  - package.json

# node-pty is a native module and has to stay a real file on disk — it cannot be
# loaded from inside the asar archive.
asarUnpack:
  - '**/node_modules/node-pty/**'

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # No Developer ID: that needs a paid account. This skips signing altogether,
  # which leaves the bundle carrying Electron's own stale signature — so
  # afterPack ad-hoc signs it. See scripts/adhoc-sign.js for why that matters.
  identity: null

afterPack: scripts/adhoc-sign.js

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target: nsis
linux:
  target: AppImage
  category: Development
